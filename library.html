<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Библиотека / SEO инспектор</title><link rel="stylesheet" href="popup.css"><link rel="stylesheet" href="library.css"></head><body><header><div><strong>SEO <span>/</span> библиотека</strong><small>Списки страниц · 0.1.10 · локальное хранилище</small></div></header><main><h1>Списки страниц</h1><div class="toolbar"><div><label for="current-list">Текущий список</label><select id="current-list"></select></div><div><label for="new-name">Новый список</label><input id="new-name" maxlength="200" placeholder="Например: конкуренты"></div><button id="new-list" class="primary">Создать</button><button id="rename-list">Переименовать</button><button id="delete-list">Удалить список</button></div><div class="actions"><button id="connect-directory">Подключить папку JSON</button><button id="sync-directory">Разрешить доступ / синхронизировать</button><button id="disconnect-directory">Отключить папку</button><button id="export-data">Экспорт JSON</button><button id="import-data">Импорт JSON</button><input id="import-file" type="file" accept="application/json,.json" hidden></div><p id="sync-status" class="hint"></p><p id="message" role="status" aria-live="polite"></p><label for="filter">Поиск по URL, заголовку, комментарию и тегам</label><input id="filter" type="search" placeholder="Введите часть текста"><p id="row-count" class="hint"></p><div class="table-wrap"><table><thead><tr><th>Страница</th><th>Комментарий</th><th>Теги через запятую</th><th>Действия</th></tr></thead><tbody id="rows"></tbody></table></div><datalist id="tag-options"></datalist><p id="empty" class="empty"></p></main><footer>Основная копия хранится в Chrome. Подключённая папка получает seo-lists.json автоматически. Экспортируйте резервную копию перед удалением расширения.</footer><script src="lists-recovery.js"></script><script src="library.js"></script></body></html>
